calculate_acb:
  query: |
    MATCH (d:Ingredient)
    WHERE d.name IN $drug_names
    OPTIONAL MATCH (d)-[r:HAS_ACB]->(a:ACBScore)
    RETURN d.name AS drug, coalesce(a.score, 0) AS score, r.source AS source

check_cyp_conflicts:
  query: |
    MATCH (d1:Ingredient)-[r1:INHIBITS]->(e:Enzyme)<-[r2:SUBSTRATE_OF]-(d2:Ingredient)
    WHERE d1.name IN $drug_names AND d2.name IN $drug_names AND d1 <> d2
    RETURN d1.name AS inhibitor, r1.strength AS inhibitor_strength, r1.source AS inhibitor_source,
           e.name AS enzyme,
           d2.name AS substrate, r2.source AS substrate_source

expand_fdc_brand:
  query: |
    MATCH (b:BrandFDC)-[r:CONTAINS_INGREDIENT]->(i:Ingredient)
    WHERE b.name IN $brand_names
    RETURN b.name AS brand, i.name AS ingredient, b.country AS country, r.source AS source

constraint_swap_search:
  query: |
    MATCH (target:Ingredient), (candidate:Ingredient)
    WHERE target.name = $target_drug
      AND candidate.name <> target.name
      AND (
        candidate.indication_class = target.indication_class
        OR (target.indication_class IN ['Opioid_Analgesic', 'Non_Opioid_Analgesic'] AND candidate.indication_class IN ['Opioid_Analgesic', 'Non_Opioid_Analgesic'])
        OR (target.indication_class IN ['SSRI_Antidepressant', 'TCA_Antidepressant', 'SNRI_SARI_Antidepressant'] AND candidate.indication_class IN ['SSRI_Antidepressant', 'SNRI_SARI_Antidepressant'])
      )
    OPTIONAL MATCH (candidate)-[:HAS_ACB]->(acb:ACBScore)
    WITH target, candidate, coalesce(acb.score, 0) AS new_acb
    WHERE new_acb = 0
    OPTIONAL MATCH (candidate)-[:INHIBITS]->(e1:Enzyme)<-[:SUBSTRATE_OF]-(cur1:Ingredient)
    WHERE cur1.name IN $current_regimen AND cur1.name <> target.name AND cur1.name <> candidate.name
    OPTIONAL MATCH (cur2:Ingredient)-[:INHIBITS]->(e2:Enzyme)<-[:SUBSTRATE_OF]-(candidate)
    WHERE cur2.name IN $current_regimen AND cur2.name <> target.name AND cur2.name <> candidate.name
    WITH target, candidate, new_acb, count(e1) + count(e2) AS conflict_count
    WHERE conflict_count = 0
    RETURN candidate.name AS recommended_swap, candidate.indication_class AS indication_class, new_acb
    ORDER BY (CASE WHEN candidate.indication_class = target.indication_class THEN 0 ELSE 1 END) ASC, candidate.name ASC
    LIMIT 5

upsert_pharmacist_ticket:
  query: |
    MERGE (t:PharmacistTicket {ticket_id: $ticket_id})
    SET t.timestamp = $timestamp,
        t.drugs = $drugs,
        t.verdict = $verdict,
        t.reason = $reason,
        t.status = coalesce(t.status, 'PENDING_REVIEW')
    RETURN t.ticket_id AS ticket_id, t.status AS status

update_ticket_decision:
  query: |
    MATCH (t:PharmacistTicket)
    WHERE t.ticket_id = $ticket_id
    SET t.status = $status,
        t.decision_note = $note,
        t.decision_timestamp = $timestamp
    RETURN t.ticket_id AS ticket_id, t.status AS status
